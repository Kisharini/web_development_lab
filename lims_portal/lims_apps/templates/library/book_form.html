<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset="UTF-8">
    <title>Library Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">

    <h1 class="mb-4">
        {% if book_key %}Edit Book{% else %}Add New Book{% endif %}
    </h1>

    <form method="post" class="border p-4 rounded shadow-sm bg-light">
        {% csrf_token %}
        
        <div class="mb-3">
            <label for="Id" class="form-label">ID (numbers only):</label>
            <input type="number" id="Id" name="Id" class="form-control" required value="{{ book.Id|default:'' }}">
        </div>

        <div class="mb-3">
            <label for="Title" class="form-label">Title:</label>
            <input type="text" id="Title" name="Title" class="form-control" required value="{{ book.Title|default:'' }}">
        </div>

        <div class="mb-3">
            <label for="Author_name" class="form-label">Author:</label>
            <input type="text" id="Author_name" name="Author_name" class="form-control" required value="{{ book.Author_name|default:'' }}">
        </div>

        <div class="mb-3">
            <label for="Genre" class="form-label">Genre:</label>
            <select id="Genre" name="Genre" class="form-select" required>
                {% for genre in genres %}
                    <option value="{{ genre }}" {% if book.Genre == genre %}selected{% endif %}>
                        {{ genre }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary">
            {% if book_key %}Update Book{% else %}Add Book{% endif %}
        </button>
    </form>

</body>
</html>
