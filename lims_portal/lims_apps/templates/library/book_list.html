<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">
    
    <h1 class="mb-4">Welcome to Our Library</h1>
    <h2 class="mb-4">Books List</h2>

    <ul class="list-group mb-4">
        {% for key, book in books.items %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <div>
                <strong>{{ book.Id }}</strong>: {{ book.Title }} by {{ book.Author_name }} ({{ book.Genre }})
            </div>
            <div>
                <!-- Edit button -->
                <a href="{% url 'edit_book' key %}" class="btn btn-sm btn-warning me-2">Edit</a>

                <!-- Delete form -->
                <form action="{% url 'delete_book' key %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-sm btn-danger"
                            onclick="return confirm('Are you sure you want to delete this book?');">
                        Delete
                    </button>
                </form>
            </div>
        </li>
        {% empty %}
        <li class="list-group-item">No books found.</li>
        {% endfor %}
    </ul>

    <a href="{% url 'book_form' %}" class="btn btn-primary">Add New Book</a>

</body>
</html>
